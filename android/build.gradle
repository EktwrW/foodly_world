buildscript {
    // AGP 8.9.1 is the minimum required by transitively-resolved AndroidX deps
    // (androidx.core 1.18, androidx.activity 1.12.4, androidx.browser 1.9,
    // androidx.navigationevent 1.0.2). Older AGP fails checkReleaseAarMetadata.
    ext.agp_version = '8.9.1'

    // Kotlin canonical version for sub-projects (Flutter plugins whose
    // Android modules apply `kotlin-android` without a version specifier
    // read it from here). DEBE estar en sync con el plugin
    // `org.jetbrains.kotlin.android` declarado en settings.gradle.
    //
    // Por qué importa: sin esto, los plugins toman la versión default de
    // Kotlin que viene con Flutter (~2.1.0 en Flutter 3.41), que falla al
    // leer metadata de jetified stdlib 2.3.10 y emite líneas `e:` ruidosas
    // aunque el build principal tenga éxito.
    //
    // 2.3.10 == versión exacta del stdlib transitivo. Actualizar acá y en
    // settings.gradle (id "org.jetbrains.kotlin.android" version "...").
    ext.kotlin_version = '2.3.10'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
