pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.3.10" apply false
    id "com.google.firebase.crashlytics" version "2.8.1" apply false
    // END: FlutterFire Configuration
    // Kotlin Plugin alineado al patch del stdlib transitivo (jetified
    // kotlin-stdlib 2.3.10) — mismo número exacto. Antes corríamos 2.3.0
    // y aunque funcionaba (mismo minor), el log de Gradle emitía notices
    // de "compiler X.Y.Z reading binaries built with X.Y.W" cada build.
    // Mantener `2.3.10` aquí y en android/build.gradle:ext.kotlin_version
    // sincronizados — son leídos por settings y por sub-projects de
    // Flutter plugins respectivamente.
    id "org.jetbrains.kotlin.android" version "2.3.10" apply false
}

include ":app"
