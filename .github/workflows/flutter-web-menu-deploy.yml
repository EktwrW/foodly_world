name: Deploy Flutter Web — Public Menu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (Public Menu)
        run: |
          flutter build web --release \
            --dart-define=IS_MENU_SUBDOMAIN=true \
            --dart-define=ENV=prod \
            --dart-define=DOMAIN=https://api.foodly.solutions \
            --dart-define=API_VERSION=/api \
            --dart-define=LOGGER_LEVEL=NOTHING \
            --dart-define=APP_ROOT=/ \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=GOOGLE_MAPS_GEOCODING_URL=https://maps.googleapis.com/maps/api/geocode/json?latlng= \
            --dart-define=GOOGLE_SIGN_IN_CLIENT_ID=${{ secrets.GOOGLE_SIGN_IN_CLIENT_ID }} \
            --dart-define=ANALYTICS_TOKEN=${{ secrets.ANALYTICS_TOKEN }} \
            --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --dart-define=REPLICATE_API_KEY=${{ secrets.REPLICATE_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (menu)
        run: firebase deploy --only hosting:menu --project foodly-solutions --token ${{ secrets.FIREBASE_TOKEN }}
