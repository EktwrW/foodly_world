name: Deploy Flutter Web — Public Menu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (Public Menu)
        # IS_MENU_SUBDOMAIN=true hace que main.dart bypasee FoodlyWrapper
        # (auth/location/etc) y sólo renderice el childWidget. La web pública
        # `menu.foodly.solutions` SÓLO muestra el menú de un negocio — no usa
        # auth, no usa Maps/Geocoding, no usa AI. Por eso NO se inyectan los
        # dart-defines GOOGLE_MAPS_API_KEY / GOOGLE_MAPS_GEOCODING_URL /
        # GOOGLE_SIGN_IN_CLIENT_ID / OPENAI_API_KEY / REPLICATE_API_KEY:
        # serían string vacío (los secrets ni existen en el repo) y abultan
        # el bundle servido al usuario público. ANALYTICS_TOKEN se mantiene
        # para trackear views del menú.
        run: |
          flutter build web --release \
            --dart-define=IS_MENU_SUBDOMAIN=true \
            --dart-define=ENV=prod \
            --dart-define=DOMAIN=https://api.foodly.solutions \
            --dart-define=API_VERSION=/api \
            --dart-define=LOGGER_LEVEL=NOTHING \
            --dart-define=APP_ROOT=/ \
            --dart-define=ANALYTICS_TOKEN=${{ secrets.ANALYTICS_TOKEN }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (menu)
        run: firebase deploy --only hosting:menu --project apps-369 --token ${{ secrets.FIREBASE_TOKEN }}
